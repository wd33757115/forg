[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
forge = "forge.main:main"

[project]
name = "forge"
version = "0.1.0"
description = "Forge — Project-level AI Operating System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0,<2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*"]

[tool.ruff]
line-length = 100
target-version = "py311"
